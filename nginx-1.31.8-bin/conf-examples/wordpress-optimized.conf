# =============================================================================
# CẤU HÌNH MẪU: TỐI ƯU HÓA CHUYÊN BIỆT CHO WORDPRESS
# =============================================================================
# Tính năng nổi bật:
# - Sử dụng module Native .htaccess của WinNginx: Mọi plugin SEO (Yoast, RankMath),
#   cache (WP Rocket, LiteSpeed) và permalink đều hoạt động tự nhiên như trên Apache.
# - Bảo mật sâu: Chặn tấn công xmlrpc, bảo vệ wp-config.php, chặn thực thi mã PHP
#   trong thư mục wp-content/uploads/.
# - Tối ưu hóa Static Caching cho toàn bộ tài nguyên themes, plugins, uploads.
# =============================================================================

server {
    listen 80;
    server_name mywordpress.local www.mywordpress.local;

    root C:/www/mywordpress.local;
    index index.php index.html index.htm;

    access_log logs/wordpress.access.log;
    error_log logs/wordpress.error.log;

    # Cho phép tải lên file dung lượng lớn (ảnh, plugin, theme)
    client_max_body_size 128M;

    # =========================================================================
    # 1. KÍCH HOẠT NATIVE .HTACCESS (HỖ TRỢ WORDPRESS HOÀN TOÀN TỰ ĐỘNG)
    # =========================================================================
    htaccess on;
    htaccess_filename .htaccess;

    # =========================================================================
    # 2. XỬ LÝ & CACHE TÀI NGUYÊN TĨNH CỦA WORDPRESS
    # =========================================================================
    location ~* \.(?:css(\.map)?|js(\.map)?|jpe?g|png|gif|ico|webp|avif|svgz?|woff2?|ttf|eot|otf|mp4|webm|flv|mp3|zip|pdf|txt)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    # =========================================================================
    # 3. BẢO MẬT CHẶN CÁC LỖ HỔNG & FILE NHẠY CẢM CỦA WORDPRESS
    # =========================================================================
    # Chặn truy cập file ẩn (.htaccess, .git, .env)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Chặn đọc trực tiếp file cấu hình cơ sở dữ liệu của WordPress
    location = /wp-config.php {
        deny all;
    }

    # Chặn xmlrpc.php (ngăn ngừa 99% các đợt tấn công Brute-force & DDoS WordPress)
    location = /xmlrpc.php {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Chặn đọc các file tài liệu mặc định tiết lộ phiên bản WordPress
    location ~* /(?:readme\.html|license\.txt|wp-config-sample\.php)$ {
        deny all;
    }

    # TUYỆT ĐỐI CHẶN thực thi mã PHP trong thư mục uploads (Chống Hacker tải webshell lên)
    location ~* /wp-content/uploads/.*\.php$ {
        deny all;
    }

    # =========================================================================
    # 4. ĐỊNH TUYẾN URL CHÍNH (PERMALINKS)
    # =========================================================================
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # =========================================================================
    # 5. XỬ LÝ PHP-CGI CHO WORDPRESS
    # =========================================================================
    location ~ \.php$ {
        try_files $fastcgi_script_name =404;

        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;

        include fastcgi.conf;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # Buffer tối ưu cho WordPress
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;

        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 180s;
        fastcgi_read_timeout 180s;
    }
}
