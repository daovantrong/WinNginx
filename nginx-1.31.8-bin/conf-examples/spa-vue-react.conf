# =============================================================================
# CẤU HÌNH MẪU: SINGLE PAGE APPLICATION (REACT / VUE / ANGULAR / SVELTE / VITE)
# =============================================================================
# Tính năng nổi bật:
# - Hỗ trợ chuẩn HTML5 History Mode: Chuyển toàn bộ route không tồn tại về index.html
#   giúp React Router / Vue Router không bị lỗi 404 khi bấm F5 reload trang.
# - Chiến lược Caching chuẩn mực:
#   + index.html: KHÔNG CACHE để người dùng nhận ngay bản update mới nhất sau khi build.
#   + /assets/*.js, *.css: CACHE VĨNH VIỄN (immutable) vì đã có hash tên file.
# - Tích hợp sẵn Reverse Proxy chuyển tiếp các request API (/api/) sang Backend (NodeJS, Python, Go, .NET).
# =============================================================================

server {
    listen 80;
    server_name spa.local www.spa.local;

    # Thư mục build đầu ra của frontend (vd: dist, build, out)
    root C:/www/my-spa-project/dist;
    index index.html;

    access_log logs/spa.access.log;
    error_log logs/spa.error.log;

    # =========================================================================
    # 1. FILE INDEX.HTML: KHÔNG ĐƯỢC CACHE (LUÔN PHỤC VỤ BẢN MỚI NHẤT)
    # =========================================================================
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # =========================================================================
    # 2. FILE ASSETS CÓ HASH TÊN FILE: CACHE 1 NĂM (IMMUTABLE)
    # =========================================================================
    # Vite, Webpack sinh tên file dạng: app.a8f9c1b2.js -> an toàn để cache tuyệt đối
    location ~* ^/assets/.*\.(?:js|css|woff2?|png|jpe?g|webp|svg)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        log_not_found off;
    }

    # =========================================================================
    # 3. REVERSE PROXY ĐẾN BACKEND API (NODEJS, NESTJS, DJANGO, FASTAPI, .NET)
    # =========================================================================
    location /api/ {
        # Backend API đang lắng nghe trên cổng 3000 (thay đổi theo backend của bạn)
        proxy_pass http://127.0.0.1:3000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Hỗ trợ WebSockets (Socket.io, SignalR, ws)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # =========================================================================
    # 4. ĐỊNH TUYẾN HTML5 HISTORY MODE (ROUTER FRONTEND)
    # =========================================================================
    location / {
        # 1. Tìm file thực tế -> 2. Tìm thư mục -> 3. Nếu không có chuyển về /index.html
        try_files $uri $uri/ /index.html;
    }

    # =========================================================================
    # 5. BẢO MẬT: CHẶN FILE ẨN
    # =========================================================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
