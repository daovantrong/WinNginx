# =============================================================================
# CẤU HÌNH MẪU: BẢO MẬT SSL / TLS & HTTP/2 CHUẨN A+ (MOZILLA SECURITY)
# =============================================================================
# Tính năng nổi bật:
# - Tận dụng bộ OpenSSL 3.5.7 nhúng tĩnh: Hỗ trợ TLS 1.3 và TLS 1.2 siêu tốc.
# - Tự động chuyển hướng toàn bộ truy cập HTTP (80) sang HTTPS (443).
# - Kích hoạt giao thức HTTP/2 tăng tốc độ tải tài nguyên song song.
# - Bộ Cipher Suites bảo mật cao, loại bỏ hoàn toàn các mã hóa yếu (RC4, 3DES, MD5).
# - Tích hợp đầy đủ các HTTP Security Headers chuẩn: HSTS, X-Frame-Options, CSP...
# =============================================================================

# 1. Chuyển hướng toàn bộ HTTP (Port 80) sang HTTPS (Port 443)
server {
    listen 80;
    server_name secure.example.com;

    # Trả về mã 301 Permanent Redirect giữ nguyên toàn bộ URI và tham số
    return 301 https://$host$request_uri;
}

# 2. Máy chủ HTTPS (Port 443)
server {
    listen 443 ssl http2;
    server_name secure.example.com;

    root C:/www/secure.example.com/public;
    index index.html index.php;

    access_log logs/secure.access.log;
    error_log logs/secure.error.log;

    # =========================================================================
    # CẤU HÌNH CHỨNG CHỈ SSL / TLS
    # =========================================================================
    # Đường dẫn đến file chứng chỉ fullchain và private key
    ssl_certificate      conf/ssl/fullchain.pem;
    ssl_certificate_key  conf/ssl/privkey.pem;

    # Chỉ cho phép TLS 1.2 và TLS 1.3 (Loại bỏ TLS 1.0, 1.1 lỗi thời)
    ssl_protocols TLSv1.2 TLSv1.3;

    # Bộ mã hóa bảo mật khuyến nghị bởi Mozilla (Intermediate Profile)
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Tối ưu hóa bộ nhớ đệm TLS Session (giảm độ trễ cho các kết nối lặp lại)
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # =========================================================================
    # BẢO MẬT: CÁC HTTP HEADERS CHUẨN A+
    # =========================================================================
    # HSTS (Strict-Transport-Security): Ép trình duyệt luôn dùng HTTPS trong 1 năm
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Chống tấn công Clickjacking
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Chống tấn công MIME-Type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Kiểm soát Referrer
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # =========================================================================
    # ĐỊNH TUYẾN MẶC ĐỊNH
    # =========================================================================
    location / {
        try_files $uri $uri/ /index.html;
    }
}
