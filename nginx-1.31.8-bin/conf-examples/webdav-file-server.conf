# =============================================================================
# CẤU HÌNH MẪU: MÁY CHỦ QUẢN LÝ TỆP TIN WEBDAV (TÍCH HỢP HTTP DAV MODULE)
# =============================================================================
# Tính năng nổi bật:
# - Tận dụng module ngx_http_dav_module được build sẵn trong WinNginx.
# - Cho phép mount thành ổ đĩa mạng trên Windows (Map Network Drive) hoặc kết nối
#   từ các phần mềm: WinSCP, Cyberduck, Nextcloud, Obsidian, Zotero...
# - Hỗ trợ đầy đủ các phương thức WebDAV: PUT, DELETE, MKCOL, COPY, MOVE.
# - Bảo mật bằng Basic Auth (tương thích cả .htpasswd truyền thống và Native htaccess).
# =============================================================================

server {
    listen 80;
    server_name webdav.local;

    # Thư mục lưu trữ dữ liệu chia sẻ qua WebDAV
    root C:/storage/webdav;

    access_log logs/webdav.access.log;
    error_log logs/webdav.error.log;

    # Cho phép upload file lớn lên tới 10GB qua WebDAV
    client_max_body_size 10G;

    # Tắt lưu file tạm ra đĩa với client PUT (nâng cao tốc độ upload)
    client_body_temp_path temp/client_body_temp;
    create_full_put_path on;

    location / {
        # 1. Bật xác thực người dùng (Basic Authentication)
        auth_basic "WebDAV Restricted Storage";
        auth_basic_user_file conf/htpasswd_webdav;

        # 2. Kích hoạt các phương thức HTTP WebDAV tiêu chuẩn
        dav_methods PUT DELETE MKCOL COPY MOVE;

        # 3. Phân quyền truy cập tệp tin (Đọc/Ghi)
        dav_access user:rw group:rw all:r;

        # 4. Tự động hiển thị danh sách file khi truy cập qua trình duyệt web
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }
}
