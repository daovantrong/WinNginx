# =============================================================================
# CẤU HÌNH MẪU: NGINX REVERSE PROXY FRONT-END CHO APACHE BACK-END
# =============================================================================
# Mô hình:
# - NGINX lắng nghe port 80/443: Trực tiếp phục vụ file tĩnh và SSL termination.
# - Apache lắng nghe port nội bộ (127.0.0.1:8080): Chuyên xử lý PHP và logic động.
# - Giảm tải 80-90% RAM và CPU cho Apache, tăng tốc độ phản hồi website tối đa.
# =============================================================================

server {
    listen 80;
    server_name example.local www.example.local;

    # Thư mục gốc chứa source web (trỏ cùng thư mục DocumentRoot của Apache)
    root C:/www/example.local/public;
    index index.php index.html index.htm;

    # Nhật ký truy cập và lỗi
    access_log logs/example.local.access.log;
    error_log logs/example.local.error.log;

    # Kích thước tối đa file upload qua proxy (ví dụ: upload ảnh/video qua PHP)
    client_max_body_size 64M;

    # =========================================================================
    # 1. NGINX TRỰC TIẾP PHỤC VỤ FILE TĨNH (STATIC FILES)
    # =========================================================================
    # Định dạng ảnh, tài liệu, video, âm thanh, webfont, css, js...
    location ~* \.(?:css(\.map)?|js(\.map)?|jpe?g|png|gif|ico|webp|avif|svgz?|woff2?|ttf|eot|otf|mp4|webm|ogv|flv|mp3|wav|ogg|m4a|zip|tar|gz|rar|bz2|7z|pdf|txt|xml|docx?|xlsx?|pptx?)$ {
        # Bật cache trình duyệt 30 ngày để tối ưu PageSpeed
        expires 30d;
        add_header Cache-Control "public, no-transform";

        # Tắt log để hạn chế ghi I/O ổ đĩa
        access_log off;
        log_not_found off;

        # Fallback thông minh:
        # 1. Tìm file tĩnh trên đĩa cứng -> NGINX phục vụ ngay lập tức.
        # 2. Nếu file không tồn tại (vd: ảnh thumbnail/captcha do PHP Apache sinh động) -> đẩy sang @apache.
        try_files $uri @apache;
    }

    # =========================================================================
    # 2. BẢO MẬT: CHẶN TRUY CẬP FILE ẨN & FILE NHẠY CẢM
    # =========================================================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* (?:composer\.(?:json|lock)|package\.(?:json|lock)|\.env.*|\.git.*|\.svn.*)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # =========================================================================
    # 3. YÊU CẦU FILE PHP: LUÔN LUÔN ĐẨY SANG APACHE
    # =========================================================================
    # Tuyệt đối không để Nginx phục vụ tĩnh file .php (tránh lộ mã nguồn)
    location ~ \.php$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Cấu hình timeouts cho các tác vụ PHP dài (vd: xuất báo cáo, import dữ liệu)
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # =========================================================================
    # 4. CÁC REQUEST CÒN LẠI (ROUTING, REWRITE, DYNAMIC)
    # =========================================================================
    location / {
        # Kiểm tra file tĩnh hoặc thư mục trước, nếu không có đẩy về Apache
        try_files $uri $uri/ @apache;
    }

    # Khối định tuyến Reverse Proxy đẩy về Apache backend
    location @apache {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Hỗ trợ HTTP/1.1 và WebSocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Buffer tối ưu cho Reverse Proxy
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
