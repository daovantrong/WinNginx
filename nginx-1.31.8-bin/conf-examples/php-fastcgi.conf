# =============================================================================
# CẤU HÌNH MẪU: NGINX THUẦN CHẠY TRỰC TIẾP VỚI PHP-CGI / PHP-FPM
# =============================================================================
# Mô hình:
# - NGINX xử lý 100% request không cần Apache.
# - Sử dụng module Native .htaccess của WinNginx (đọc trực tiếp file .htaccess).
# - Chuyển tiếp các file .php sang PHP-CGI chạy ở port 9000 (hoặc cluster PHP).
# =============================================================================

# Khai báo nhóm tiến trình PHP-CGI trên Windows (có thể chạy nhiều tiến trình php-cgi.exe)
upstream php_backend {
    server 127.0.0.1:9000;
    # server 127.0.0.1:9001; # Bật thêm nếu chạy cụm nhiều worker php-cgi
    # server 127.0.0.1:9002;
    keepalive 16;
}

server {
    listen 80;
    server_name myapp.local www.myapp.local;

    root C:/www/myapp.local/public;
    index index.php index.html index.htm;

    access_log logs/myapp.access.log;
    error_log logs/myapp.error.log;

    client_max_body_size 64M;

    # =========================================================================
    # 1. KÍCH HOẠT MODULE NATIVE .HTACCESS CỦA WINNGINX
    # =========================================================================
    # Tự động đọc và thực thi RewriteRule, Require, Header,... từ file .htaccess
    htaccess on;
    htaccess_filename .htaccess;

    # =========================================================================
    # 2. XỬ LÝ TOÀN BỘ FILE TĨNH (STATIC FILES)
    # =========================================================================
    location ~* \.(?:css(\.map)?|js(\.map)?|jpe?g|png|gif|ico|webp|avif|svgz?|woff2?|ttf|eot|otf|mp4|webm|ogv|flv|mp3|wav|ogg|m4a|zip|tar|gz|rar|bz2|7z|pdf|txt|xml|docx?|xlsx?|pptx?)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    # =========================================================================
    # 3. BẢO MẬT: CHẶN TRUY CẬP FILE ẨN VÀ FILE CẤU HÌNH NHẠY CẢM
    # =========================================================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* (?:composer\.(?:json|lock)|package\.(?:json|lock)|\.env.*|\.git.*|\.sql)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Chống thực thi file PHP trong thư mục tải lên (Uploads / User Content)
    location ~* /(?:uploads|files|images|media)/.*\.php$ {
        deny all;
    }

    # =========================================================================
    # 4. ĐỊNH TUYẾN URL CHÍNH (URL REWRITE / FRONT CONTROLLER)
    # =========================================================================
    location / {
        # Tìm file thực tế -> Thư mục -> Nếu không có chuyển về index.php kèm query string
        try_files $uri $uri/ /index.php?$query_string;
    }

    # =========================================================================
    # 5. XỬ LÝ FASTCGI CHO CÁC FILE PHP
    # =========================================================================
    location ~ \.php$ {
        # Đảm bảo file tồn tại trước khi đẩy sang PHP-CGI (Chống lỗi Zero-day NGINX)
        try_files $fastcgi_script_name =404;

        fastcgi_pass php_backend;
        fastcgi_index index.php;

        # Cấu hình FastCGI Parameters
        include fastcgi.conf;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Tối ưu hóa Buffer FastCGI (chống lỗi 502 Bad Gateway khi dữ liệu phản hồi lớn)
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;

        # Cấu hình Timeout cho các script chạy lâu
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 180s;
        fastcgi_read_timeout 180s;

        # Giữ kết nối FastCGI Persistent
        fastcgi_keep_conn on;
    }
}
