# =============================================================================
# CẤU HÌNH MẪU: CÂN BẰNG TẢI (LOAD BALANCING) & CỤM SERVER BACKEND
# =============================================================================
# Tính năng nổi bật:
# - Cân bằng tải cho cụm ứng dụng (NodeJS, Go, Java Spring, PHP-FPM, IIS...).
# - Hỗ trợ các giải thuật: Round-Robin (mặc định), least_conn, ip_hash.
# - Tự động phát hiện server chết (Passive Health-check) và failover mượt mà.
# - Tái sử dụng kết nối Keepalive đến upstream, tối đa hóa thông lượng (RPS).
# =============================================================================

upstream backend_cluster {
    # 1. Giải thuật cân bằng tải (Chọn 1 trong các chế độ sau):
    # - Mặc định (bỏ trống): Weighted Round-Robin (chia đều theo trọng số).
    # - least_conn; : Đẩy request vào node backend đang có ít kết nối nhất (khuyên dùng).
    # - ip_hash;    : Gắn chặt client IP vào 1 node cố định (Sticky Session).
    least_conn;

    # 2. Danh sách các máy chủ backend trong cụm:
    # - weight: Trọng số phân phối (máy mạnh gán số lớn hơn).
    # - max_fails: Số lần lỗi liên tiếp trước khi tạm dừng gửi request.
    # - fail_timeout: Thời gian đánh dấu server offline trước khi thử kết nối lại.
    server 127.0.0.1:8081 weight=3 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:8082 weight=2 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:8083 weight=1 max_fails=3 fail_timeout=10s;

    # Server dự phòng: Chỉ nhận request khi toàn bộ các server chính đều offline
    # server 127.0.0.1:8089 backup;

    # Tối ưu hóa Keepalive kết nối đến upstream (tránh tạo lại TCP handshake liên tục)
    keepalive 32;
}

server {
    listen 80;
    server_name cluster.local www.cluster.local;

    access_log logs/cluster.access.log;
    error_log logs/cluster.error.log;

    # Kích thước file upload
    client_max_body_size 50M;

    location / {
        proxy_pass http://backend_cluster;

        # Header nhận diện client thực tế
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Bắt buộc để sử dụng keepalive đến upstream hiệu quả
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Hỗ trợ WebSockets
        # proxy_set_header Upgrade $http_upgrade;
        # proxy_set_header Connection "upgrade";

        # Cơ chế Failover tự động chuyển server nếu gặp lỗi
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 10s;

        # Timeouts kết nối
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Buffer phản hồi
        proxy_buffer_size 64k;
        proxy_buffers 8 128k;
        proxy_busy_buffers_size 128k;
    }
}
