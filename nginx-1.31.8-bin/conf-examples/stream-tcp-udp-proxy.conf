# =============================================================================
# CẤU HÌNH MẪU: LAYER 4 STREAM PROXY (TCP / UDP PROXY & LOAD BALANCING)
# =============================================================================
# Lưu ý quan trọng:
# - Module Stream hoạt động ở Tầng Giao vận (Layer 4 - TCP/UDP), độc lập với HTTP.
# - Khối cấu hình này phải được đặt ở ngoài cùng của nginx.conf (cùng cấp với http {}),
#   hoặc dùng lệnh: include stream/*.conf; ở mức root trong nginx.conf.
#
# Các ứng dụng phổ biến:
# 1. Reverse Proxy & Cân bằng tải cho Database: MySQL (3306), PostgreSQL (5432), Redis (6379).
# 2. Cân bằng tải UDP: DNS (53), game server UDP, NTP.
# 3. SSL Preread: Đọc hostname SNI từ handshake TLS để định tuyến mà không cần giải mã SSL.
# =============================================================================

stream {
    # -------------------------------------------------------------------------
    # 1. REVERSE PROXY & CÂN BẰNG TẢI CHO CƠ SỞ DỮ LIỆU MYSQL / MARIADB
    # -------------------------------------------------------------------------
    upstream mysql_cluster {
        # Cân bằng tải giữa các node database đọc (Read Replicas)
        server 192.168.1.101:3306 weight=3 max_fails=2 fail_timeout=5s;
        server 192.168.1.102:3306 weight=2 max_fails=2 fail_timeout=5s;
    }

    server {
        # Lắng nghe port 3306 trên Nginx và chuyển tiếp đến cụm MySQL nội bộ
        listen 3306;
        proxy_pass mysql_cluster;

        # Timeout cho kết nối database dài hạn
        proxy_connect_timeout 5s;
        proxy_timeout 300s;
    }

    # -------------------------------------------------------------------------
    # 2. REVERSE PROXY CHO CỤM BỘ NHỚ ĐỆM REDIS
    # -------------------------------------------------------------------------
    upstream redis_backend {
        server 127.0.0.1:6379;
    }

    server {
        listen 6380; # Client kết nối vào cổng 6380
        proxy_pass redis_backend;
        proxy_timeout 3600s;
    }

    # -------------------------------------------------------------------------
    # 3. CÂN BẰNG TẢI GIAO THỨC UDP (VÍ DỤ: DNS SERVER PORT 53)
    # -------------------------------------------------------------------------
    upstream dns_servers {
        server 1.1.1.1:53;
        server 8.8.8.8:53;
    }

    server {
        # Thêm cờ udp để lắng nghe gói tin UDP
        listen 5353 udp;
        proxy_pass dns_servers;
        proxy_timeout 5s;
        proxy_responses 1;
    }

    # -------------------------------------------------------------------------
    # 4. SSL PREREAD: ĐỊNH TUYẾN SNI PASSTHROUGH (KHÔNG CẦN GIẢI MÃ CHỨNG CHỈ)
    # -------------------------------------------------------------------------
    # NGINX tự động trích xuất domain (SNI) từ gói TLS ClientHello để chọn backend
    map $ssl_preread_server_name $name_backend {
        app1.example.com     192.168.1.10:443;
        app2.example.com     192.168.1.20:443;
        default              127.0.0.1:8443;
    }

    server {
        listen 443;
        proxy_pass $name_backend;
        ssl_preread on; # Kích hoạt bộ đọc trước gói SNI
    }
}
